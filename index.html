class="caja">

<h2>📨 Estado del ESP</h2>

<p id="estadoESP">
--
</p>

</div>


<div class="caja">

<h2>💡 LED</h2>

<button onclick="encender()">ON</button>

<button onclick="apagar()">OFF</button>

<p id="ledEstado">
--
</p>

</div>


<script>

const host = "wss://b006397215434ca192ccab8d5f534293.s1.eu.hivemq.cloud:8884/mqtt";

const usuario = "caldera2026";

const contraseña = "17681768";


const cliente = mqtt.connect(host, {

    username: usuario,

    password: contraseña,

    clientId: "PaginaCaldera_" + Math.random().toString(16).substr(2, 8)

});


cliente.on("connect", function() {

    document.getElementById("mqttEstado").innerHTML =
        "<span style='color:green;'>CONECTADO</span>";

    cliente.subscribe("caldera/estado");

});


cliente.on("message", function(topic, message) {

    const mensaje = message.toString();

    if (topic === "caldera/estado") {

        document.getElementById("estadoESP").innerHTML =
            mensaje;

    }

});


cliente.on("error", function(error) {

    document.getElementById("mqttEstado").innerHTML =
        "<span style='color:red;'>ERROR MQTT</span>";

    console.log(error);

});


function encender() {

    cliente.publish("caldera/rele", "on");

    document.getElementById("ledEstado").innerHTML =
        "<span style='color:green;'>ON - RÁPIDO</span>";

}


function apagar() {

    cliente.publish("caldera/rele", "off");

    document.getElementById("ledEstado").innerHTML =
        "<span style='color:gray;'>OFF - NORMAL</span>";

}

</script>

</body>
</html>
